<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a0c">
  <title>Games</title>

  <style>
    :root {
      --bg: #090a0c;
      --surface: #111318;
      --surface-hover: #171a20;
      --line: #292d35;
      --line-hover: #454a54;
      --text: #eceef1;
      --muted: #9297a0;
      --faint: #626771;
      --accent: #f0f1f3;
      --accent-text: #0b0c0e;
      --glow: rgba(255,255,255,.08);
      --shadow: rgba(0,0,0,.32);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      transition: background .35s ease;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(
          ellipse at 50% -12%,
          var(--glow),
          transparent 44%
        ),
        var(--bg);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      transition:
        background .35s ease,
        color .35s ease;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .hidden {
      display: none !important;
    }


    /* ============================================================
       LOGIN
    ============================================================ */

    .login {
      width: min(340px, 100%);
      text-align: center;
      animation:
        fadeUp .65s cubic-bezier(.22,1,.36,1) both;
    }

    .login-mark {
      width: 34px;
      height: 34px;
      margin: 0 auto 26px;
      border: 1px solid var(--line-hover);
      border-radius: 50%;
      position: relative;
      transition: border-color .3s ease;
    }

    .login-mark::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
    }

    .login h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 450;
      letter-spacing: -.45px;
    }

    .login p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .login-form {
      position: relative;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 78px 0 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      text-align: center;
      transition:
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }

    input::placeholder {
      color: var(--faint);
    }

    input:focus {
      border-color: var(--line-hover);
      background: var(--surface-hover);
      box-shadow: 0 0 0 4px var(--glow);
    }

    .enter {
      position: absolute;
      right: 5px;
      top: 5px;
      height: 36px;
      padding: 0 13px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition:
        transform .2s ease,
        opacity .2s ease;
    }

    .enter:hover {
      opacity: .82;
    }

    .enter:active {
      transform: scale(.96);
    }

    .error {
      height: 18px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      opacity: 0;
      transition: opacity .25s ease;
    }

    .error.visible {
      opacity: 1;
    }


    /* ============================================================
       HUB
    ============================================================ */

    .hub {
      width: min(980px, 100%);
      padding: 34px 0 55px;
      animation:
        fadeUp .65s cubic-bezier(.22,1,.36,1) both;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .heading h1 {
      margin: 0 0 5px;
      font-size: 21px;
      font-weight: 450;
      letter-spacing: -.45px;
    }

    .heading p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .action {
      border: 0;
      padding: 5px 0;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      cursor: pointer;
      transition: color .2s ease;
    }

    .action:hover {
      color: var(--text);
    }

    .search-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .search {
      height: 42px;
      padding: 0 40px 0 13px;
      text-align: left;
      border-radius: 8px;
      background: var(--surface);
    }

    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      width: 13px;
      height: 13px;
      border: 1px solid var(--muted);
      border-radius: 50%;
      transform: translateY(-55%);
      pointer-events: none;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 1px;
      right: -4px;
      bottom: -2px;
      background: var(--muted);
      transform: rotate(45deg);
    }

    .filter-row {
      min-height: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 1px 10px;
    }

    .tabs {
      display: flex;
      gap: 16px;
    }

    .tab,
    .random {
      border: 0;
      padding: 3px 0;
      color: var(--faint);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
      transition: color .2s ease;
    }

    .tab.active,
    .tab:hover,
    .random:hover {
      color: var(--text);
    }

    .games {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 10px;
    }


    /* ============================================================
       GAME CARD
    ============================================================ */

    .game {
      min-width: 0;
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      padding: 16px;
      color: var(--text);
      text-decoration: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      opacity: 0;
      cursor: pointer;
      animation:
        cardIn .5s cubic-bezier(.22,1,.36,1) forwards;
      transition:
        background .28s ease,
        border-color .28s ease,
        transform .28s cubic-bezier(.22,1,.36,1),
        box-shadow .28s ease;
    }

    .game::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--game-bg, transparent);
      opacity: .95;
      transition:
        opacity .3s ease,
        transform .45s ease;
    }

    .game::after {
      content: "";
      position: absolute;
      inset: 35% 0 0;
      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(0,0,0,.52)
        );
      pointer-events: none;
    }

    .game:hover {
      background: var(--surface-hover);
      border-color: var(--line-hover);
      transform: translateY(-3px);
      box-shadow: 0 14px 32px var(--shadow);
    }

    .game:hover::before {
      opacity: 1;
      transform: scale(1.06);
    }

    .game-info {
      position: relative;
      z-index: 2;
      padding-right: 24px;
    }

    .game-name {
      display: block;
      font-size: 14px;
      font-weight: 450;
      letter-spacing: -.1px;
    }

    .game-meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .game-open-hint {
      position: absolute;
      z-index: 3;
      top: 13px;
      left: 14px;
      color: var(--faint);
      font-size: 9px;
      opacity: 0;
      transform: translateY(-3px);
      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .game:hover .game-open-hint {
      opacity: 1;
      transform: translateY(0);
    }

    .star {
      position: absolute;
      z-index: 3;
      top: 10px;
      right: 11px;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 17px;
      line-height: 22px;
      cursor: pointer;
      transition:
        color .2s ease,
        transform .2s ease;
    }

    .star:hover {
      color: var(--text);
      transform: scale(1.1);
    }

    .star.active {
      color: var(--accent);
    }

    .star.pop {
      animation:
        starPop .38s cubic-bezier(.22,1,.36,1);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 10px;
      font-size: 12px;
    }


    /* ============================================================
       RECENT
    ============================================================ */

    .recent {
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      animation:
        fadeUp .45s ease both;
    }

    .recent-title {
      margin: 0 0 10px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .recent-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .recent-list::-webkit-scrollbar {
      display: none;
    }

    .recent-item {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: var(--surface);
      text-decoration: none;
      font-size: 11px;
      transition:
        border-color .2s ease,
        color .2s ease,
        background .2s ease,
        transform .2s ease;
    }

    .recent-item:hover {
      color: var(--text);
      border-color: var(--line-hover);
      background: var(--surface-hover);
      transform: translateY(-1px);
    }


    /* ============================================================
       GAME DETAIL MODAL
    ============================================================ */

    .game-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(11px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .game-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .game-modal-card {
      width: min(430px, 100%);
      position: relative;
      overflow: hidden;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      box-shadow:
        0 30px 100px rgba(0,0,0,.45);
      transform:
        translateY(12px)
        scale(.975);
      transition:
        transform .3s cubic-bezier(.22,1,.36,1);
    }

    .game-modal.open .game-modal-card {
      transform:
        translateY(0)
        scale(1);
    }

    .modal-glow {
      position: absolute;
      width: 240px;
      height: 240px;
      top: -130px;
      right: -90px;
      border-radius: 50%;
      background: var(--modal-color);
      opacity: .14;
      filter: blur(15px);
      pointer-events: none;
      transition: background .3s ease;
    }

    .modal-header {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 25px;
    }

    .modal-title {
      margin: 0 0 5px;
      font-size: 22px;
      font-weight: 450;
      letter-spacing: -.5px;
    }

    .modal-genre {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .modal-close {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      transition:
        color .2s ease,
        border-color .2s ease,
        background .2s ease,
        transform .2s ease;
    }

    .modal-close:hover {
      color: var(--text);
      border-color: var(--line-hover);
      background: var(--surface-hover);
      transform: rotate(3deg);
    }

    .vibe-label {
      position: relative;
      z-index: 2;
      margin-bottom: 13px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .vibes {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 15px;
    }

    .vibe {
      display: grid;
      grid-template-columns: 82px 1fr 27px;
      align-items: center;
      gap: 10px;
    }

    .vibe-name {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .02em;
    }

    .vibe-track {
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }

    .vibe-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--modal-color);
      box-shadow:
        0 0 12px var(--modal-color);
      transform-origin: left center;
      transition:
        width .85s cubic-bezier(.22,1,.36,1);
    }

    .vibe-value {
      color: var(--faint);
      font-size: 9px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .modal-divider {
      height: 1px;
      margin: 23px 0 18px;
      background: var(--line);
    }

    .modal-tags {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 24px;
    }

    .modal-tag {
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--muted);
      background: var(--bg);
      font-size: 9px;
    }

    .modal-actions {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .play-button {
      flex: 1;
      height: 39px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .play-button:hover {
      opacity: .84;
    }

    .play-button:active {
      transform: scale(.98);
    }

    .modal-favorite {
      width: 42px;
      height: 39px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      transition:
        color .2s ease,
        border-color .2s ease,
        background .2s ease;
    }

    .modal-favorite:hover {
      color: var(--text);
      border-color: var(--line-hover);
      background: var(--surface-hover);
    }

    .modal-favorite.active {
      color: var(--accent);
    }


    /* ============================================================
       THEMES
    ============================================================ */

    .theme-panel {
      position: fixed;
      z-index: 15;
      right: 24px;
      bottom: 24px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      box-shadow: 0 15px 45px var(--shadow);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition:
        opacity .2s ease,
        transform .2s ease;
    }

    .theme-panel.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .theme-button {
      width: 34px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--muted);
      background: var(--bg);
      font-size: 9px;
      cursor: pointer;
      transition:
        border-color .2s ease,
        color .2s ease;
    }

    .theme-button:hover {
      color: var(--text);
      border-color: var(--line-hover);
    }


    /* ============================================================
       SHORTCUTS
    ============================================================ */

    .shortcuts {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(9px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .shortcuts.open {
      opacity: 1;
      pointer-events: auto;
    }

    .shortcut-card {
      width: min(360px, 100%);
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 20px 70px var(--shadow);
      transform: translateY(6px);
      transition: transform .2s ease;
    }

    .shortcuts.open .shortcut-card {
      transform: translateY(0);
    }

    .shortcut-card h2 {
      margin: 0 0 16px;
      font-size: 14px;
      font-weight: 500;
    }

    .shortcut {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      color: var(--muted);
      font-size: 12px;
    }

    kbd {
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
      background: var(--bg);
      font-size: 10px;
    }


    /* ============================================================
       GAME VISUAL SYSTEM
    ============================================================ */

    .game {
      --game-color: #888888;
      --game-amount: .18;
      --game-soft:
        color-mix(
          in srgb,
          var(--game-color) 22%,
          transparent
        );
      --game-strong:
        color-mix(
          in srgb,
          var(--game-color) 48%,
          transparent
        );
    }

    .game[data-pattern="none"]::before {
      background:
        linear-gradient(
          135deg,
          var(--game-soft),
          transparent 68%
        );
    }

    .game[data-pattern="glow"]::before {
      background:
        radial-gradient(
          circle at 82% 18%,
          var(--game-strong),
          transparent
            calc(
              18% +
              var(--game-amount) * 20%
            )
        );
    }

    .game[data-pattern="grid"]::before {
      background:
        linear-gradient(
          var(--game-soft) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          var(--game-soft) 1px,
          transparent 1px
        ),
        linear-gradient(
          135deg,
          var(--game-soft),
          transparent 70%
        );
      background-size:
        calc(18px - var(--game-amount) * 4px)
        calc(18px - var(--game-amount) * 4px),
        calc(18px - var(--game-amount) * 4px)
        calc(18px - var(--game-amount) * 4px),
        auto;
    }

    .game[data-pattern="lines"]::before {
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0 11px,
          var(--game-soft) 11px 12px
        ),
        linear-gradient(
          135deg,
          var(--game-soft),
          transparent 72%
        );
    }

    .game[data-pattern="dots"]::before {
      background:
        radial-gradient(
          circle,
          var(--game-strong) 1px,
          transparent 1.5px
        ),
        linear-gradient(
          135deg,
          var(--game-soft),
          transparent 72%
        );
      background-size:
        calc(12px - var(--game-amount) * 2px)
        calc(12px - var(--game-amount) * 2px),
        auto;
    }

    .game[data-pattern="diagonal"]::before {
      background:
        repeating-linear-gradient(
          135deg,
          transparent 0 12px,
          var(--game-soft) 12px 13px
        ),
        linear-gradient(
          135deg,
          var(--game-soft),
          transparent 72%
        );
    }

    .game[data-pattern="rings"]::before {
      background:
        repeating-radial-gradient(
          circle at 82% 18%,
          transparent 0 8px,
          var(--game-soft) 9px 10px
        );
    }

    .game[data-pattern="noise"]::before {
      background:
        radial-gradient(
          circle at 20% 25%,
          var(--game-soft) 0 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle at 70% 65%,
          var(--game-soft) 0 1px,
          transparent 1.5px
        ),
        linear-gradient(
          135deg,
          var(--game-soft),
          transparent 75%
        );
      background-size:
        13px 13px,
        17px 17px,
        auto;
    }


    /* ============================================================
       ANIMATIONS
    ============================================================ */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes starPop {
      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.45) rotate(8deg);
      }

      65% {
        transform: scale(.88) rotate(-4deg);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes modalPulse {
      0% {
        opacity: .08;
      }

      50% {
        opacity: .17;
      }

      100% {
        opacity: .08;
      }
    }


    /* ============================================================
       RESPONSIVE
    ============================================================ */

    @media (max-width: 850px) {
      .games {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .games {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .game {
        min-height: 105px;
      }
    }

    @media (max-width: 440px) {
      .screen {

    @media (prefers-reduced-motion: reduce) {

      *::after {
        animation-duration: .01ms !important;

  </style>

  <script>

    /* ============================================================

    const games = [

      },

      {

      {

        color: "#e03239",
        amount: 0.26,
        pattern: "rings",

        mode: "Singleplayer",
        type: "RPG",
        playtime: "2–4 hrs",

        intensity: 6,
        difficulty: 5,
        chaos: 7
      },

      {
        name: "World's Hardest Game",
        href: "worldshardestgame.html",
        genre: "Arcade · Challenge",
        color: "#3390da",
        amount: 0.24,
        pattern: "lines",

        mode: "Singleplayer",
        type: "Challenge",
        playtime: "5–20 min",

        intensity: 8,
        difficulty: 10,
        chaos: 5
      }

    ];


    /* ============================================================
       SETTINGS
    ============================================================ */

    const PASSWORD = "5008";

    const IDEA_FORM =
      "https://forms.gle/rNUFYRVaEEqLbyeQ7";


    /* ============================================================
       ELEMENTS
    ============================================================ */

    const loginScreen =
      document.getElementById("loginScreen");

    const hubScreen =
      document.getElementById("hubScreen");

    const loginForm =
      document.getElementById("loginForm");

    const passwordInput =
      document.getElementById("password");

    const error =
      document.getElementById("error");

    const logout =
      document.getElementById("logout");

    const search =
      document.getElementById("search");

    const gamesContainer =
      document.getElementById("games");

    const gameCount =
      document.getElementById("gameCount");

    const recentSection =
      document.getElementById("recent");

    const recentList =
      document.getElementById("recentList");

    const shortcuts =
      document.getElementById("shortcuts");

    const shortcutButton =
      document.getElementById("shortcutButton");

    const themeToggle =
      document.getElementById("themeToggle");

    const themePanel =
      document.getElementById("themePanel");

    const randomButton =
      document.getElementById("randomButton");

    const ideaButton =
      document.getElementById("ideaButton");

    const gameModal =
      document.getElementById("gameModal");

    const modalTitle =
      document.getElementById("modalTitle");

    const modalGenre =
      document.getElementById("modalGenre");

    const modalGlow =
      document.getElementById("modalGlow");

    const vibes =
      document.getElementById("vibes");

    const modalTags =
      document.getElementById("modalTags");

    const modalClose =
      document.getElementById("modalClose");

    const playButton =
      document.getElementById("playButton");

    const modalFavorite =
      document.getElementById("modalFavorite");


    /* ============================================================
       STATE
    ============================================================ */

    let currentFilter = "all";

    let selectedGame = null;

    const favorites = new Set(
      JSON.parse(
        localStorage.getItem(
          "gameFavorites"
        ) || "[]"
      )
    );

    let recentGames = JSON.parse(
      localStorage.getItem(
        "recentGames"
      ) || "[]"
    );


    /* ============================================================
       STORAGE
    ============================================================ */

    function saveFavorites() {

      localStorage.setItem(
        "gameFavorites",
        JSON.stringify([
          ...favorites
        ])
      );

    }


    function saveRecent() {

      localStorage.setItem(
        "recentGames",
        JSON.stringify(
          recentGames
        )
      );

    }


    /* ============================================================
       FILTERING
    ============================================================ */

    function getFilteredGames() {

      const query =
        search.value
          .trim()
          .toLowerCase();

      return games.filter(game => {

        const matchesSearch =
          !query ||
          game.name
            .toLowerCase()
            .includes(query) ||
          game.genre
            .toLowerCase()
            .includes(query);

        const matchesFilter =
          currentFilter === "all" ||
          favorites.has(game.name);

        return (
          matchesSearch &&
          matchesFilter
        );

      });

    }


    /* ============================================================
       RENDER GAMES
    ============================================================ */

    function renderGames() {

      const visibleGames =
        getFilteredGames();

      gamesContainer.innerHTML = "";


      if (!visibleGames.length) {

        const empty =
          document.createElement("div");

        empty.className = "empty";

        empty.textContent =
          currentFilter === "favorites"
            ? "No favorites yet."
            : "No games found.";

        gamesContainer.appendChild(
          empty
        );

      } else {

        visibleGames.forEach(
          (game, index) => {

            const card =
              document.createElement("div");

            card.className = "game";

            card.dataset.pattern =
              game.pattern || "none";

            card.style.setProperty(
              "--game-color",
              game.color || "#888888"
            );

            card.style.setProperty(
              "--game-amount",
              String(
                Math.max(
                  0,
                  Math.min(
                    1,
                    Number(game.amount) || 0
                  )
                )
              )
            );

            card.style.animationDelay =
              `${Math.min(
                index * 0.035,
                .35
              )}s`;


            const isFavorite =
              favorites.has(
                game.name
              );


            card.innerHTML = `

              <span class="game-open-hint">
                OPEN →
              </span>

              <button
                class="star ${
                  isFavorite
                    ? "active"
                    : ""
                }"
                type="button"
                aria-label="${
                  isFavorite
                    ? "Remove"
                    : "Add"
                } ${
                  game.name
                } ${
                  isFavorite
                    ? "from"
                    : "to"
                } favorites"
              >
                ${
                  isFavorite
                    ? "★"
                    : "☆"
                }
              </button>

              <div class="game-info">

                <span class="game-name">
                  ${game.name}
                </span>

                <span class="game-meta">
                  ${game.genre || ""}
                </span>

              </div>

            `;


            card.addEventListener(
              "click",
              event => {

                if (
                  event.target.closest(
                    ".star"
                  )
                ) {
                  return;
                }

                openGameModal(game);

              }
            );


            card
              .querySelector(".star")
              .addEventListener(
                "click",
                event => {

                  event.preventDefault();
                  event.stopPropagation();

                  toggleFavorite(
                    game
                  );

                }
              );


            gamesContainer.appendChild(
              card
            );

          }
        );

      }


      const shown =
        visibleGames.length;

      gameCount.textContent =
        currentFilter === "favorites"
          ? `${shown} favorite${
              shown === 1
                ? ""
                : "s"
            }`
          : search.value.trim()
            ? `${shown} of ${
                games.length
              } games`
            : `${games.length} games`;


      renderRecent();

    }


    /* ============================================================
       FAVORITES
    ============================================================ */

    function toggleFavorite(game) {

      if (
        favorites.has(game.name)
      ) {

        favorites.delete(
          game.name
        );

      } else {

        favorites.add(
          game.name
        );

      }

      saveFavorites();

      renderGames();


      if (
        selectedGame &&
        selectedGame.name ===
          game.name
      ) {

        updateModalFavorite(
          game
        );

      }

    }


    function updateModalFavorite(game) {

      const active =
        favorites.has(
          game.name
        );

      modalFavorite.classList.toggle(
        "active",
        active
      );

      modalFavorite.textContent =
        active
          ? "★"
          : "☆";

    }


    /* ============================================================
       RECENT
    ============================================================ */

    function addRecent(game) {

      recentGames = [
        game.name,
        ...recentGames.filter(
          name =>
            name !== game.name
        )
      ].slice(0, 5);

      saveRecent();

    }


    function renderRecent() {

      const recent =
        recentGames
          .map(name =>
            games.find(
              game =>
                game.name === name
            )
          )
          .filter(Boolean);


      recentList.innerHTML = "";


      if (!recent.length) {

        recentSection
          .classList
          .add("hidden");

        return;

      }


      recentSection
        .classList
        .remove("hidden");


      recent.forEach(game => {

        const link =
          document.createElement("a");

        link.className =
          "recent-item";

        link.href =
          game.href;

        link.textContent =
          game.name;

        link.addEventListener(
          "click",
          () => {
            addRecent(game);
          }
        );

        recentList.appendChild(
          link
        );

      });

    }


    /* ============================================================
       GAME MODAL
    ============================================================ */

    function openGameModal(game) {

      selectedGame = game;

      modalTitle.textContent =
        game.name;

      modalGenre.textContent =
        game.genre || "";

      modalGlow.style.setProperty(
        "--modal-color",
        game.color || "#888888"
      );

      gameModal.style.setProperty(
        "--modal-color",
        game.color || "#888888"
      );


      /* --------------------------------
         VIBE BARS
      -------------------------------- */

      const vibeData = [
        {
          name: "Intensity",
          value: game.intensity
        },
        {
          name: "Difficulty",
          value: game.difficulty
        },
        {
          name: "Chaos",
          value: game.chaos
        }
      ];


      vibes.innerHTML = "";


      vibeData.forEach(
        (vibe, index) => {

          const safeValue =
            Math.max(
              0,
              Math.min(
                10,
                Number(vibe.value) || 0
              )
            );


          const row =
            document.createElement(
              "div"
            );

          row.className =
            "vibe";


          row.innerHTML = `

            <span class="vibe-name">
              ${vibe.name}
            </span>

            <div class="vibe-track">

              <div
                class="vibe-fill"
                style="
                  transition-delay:
                    ${index * 100}ms;
                "
              ></div>

            </div>

            <span class="vibe-value">
              ${safeValue}/10
            </span>

          `;


          vibes.appendChild(
            row
          );


          const fill =
            row.querySelector(
              ".vibe-fill"
            );


          /*
            Small timeout lets the browser
            render the bar at 0% first.

            Then it smoothly grows to
            its actual value.
          */

          requestAnimationFrame(
            () => {

              requestAnimationFrame(
                () => {

                  fill.style.width =
                    `${safeValue * 10}%`;

                }
              );

            }
          );

        }
      );


      /* --------------------------------
         TAGS
      -------------------------------- */

      modalTags.innerHTML = "";


      const tags = [
        game.mode,
        game.type,
        game.playtime
      ].filter(Boolean);


      tags.forEach(tag => {

        const element =
          document.createElement(
            "span"
          );

        element.className =
          "modal-tag";

        element.textContent =
          tag;

        modalTags.appendChild(
          element
        );

      });


      updateModalFavorite(
        game
      );


      gameModal.classList.add(
        "open"
      );

      document.body.style.overflow =
        "hidden";


      setTimeout(
        () => modalClose.focus(),
        100
      );

    }


    function closeGameModal() {

      gameModal.classList.remove(
        "open"
      );

      document.body.style.overflow =
        "";

      selectedGame = null;

    }


    /* ============================================================
       LOGIN
    ============================================================ */

    function showHub() {

      loginScreen.classList.add(
        "hidden"
      );

      hubScreen.classList.remove(
        "hidden"
      );

      sessionStorage.setItem(
        "gameHubUnlocked",
        "true"
      );

      renderGames();

      setTimeout(
        () => search.focus(),
        150
      );

    }


    function showLogin() {

      hubScreen.style.transition =
        "opacity .28s ease, filter .28s ease, transform .28s ease";

      hubScreen.style.opacity =
        "0";

      hubScreen.style.filter =
        "blur(7px)";

      hubScreen.style.transform =
        "scale(.99)";


      setTimeout(() => {

        hubScreen.classList.add(
          "hidden"
        );

        hubScreen.style.opacity =
          "";

        hubScreen.style.filter =
          "";

        hubScreen.style.transform =
          "";

        loginScreen.classList.remove(
          "hidden"
        );

        passwordInput.value =
          "";

        error.classList.remove(
          "visible"
        );

        sessionStorage.removeItem(
          "gameHubUnlocked"
        );

        setTimeout(
          () =>
            passwordInput.focus(),
          50
        );

      }, 280);

    }


    /* ============================================================
       RANDOM
    ============================================================ */

    function randomGame() {

      const available =
        getFilteredGames();

      if (!available.length) {
        return;
      }


      const game =
        available[
          Math.floor(
            Math.random() *
            available.length
          )
        ];


      addRecent(game);

      window.location.href =
        game.href;

    }


    /* ============================================================
       THEMES
    ============================================================ */

    function setTheme(theme) {

      const themes = {

        midnight: {
          bg: "#090a0c",
          surface: "#111318",
          surfaceHover: "#171a20",
          line: "#292d35",
          lineHover: "#454a54",
          text: "#eceef1",
          muted: "#9297a0",
          faint: "#626771",
          accent: "#f0f1f3",
          accentText: "#0b0c0e",
          glow: "rgba(255,255,255,.08)"
        },

        amoled: {
          bg: "#000000",
          surface: "#090909",
          surfaceHover: "#101010",
          line: "#191919",
          lineHover: "#303030",
          text: "#f2f2f2",
          muted: "#777777",
          faint: "#454545",
          accent: "#ffffff",
          accentText: "#000000",
          glow: "rgba(255,255,255,.055)"
        },

        paper: {
          bg: "#e9e7e1",
          surface: "#f5f3ee",
          surfaceHover: "#ffffff",
          line: "#d5d1c8",
          lineHover: "#bcb7ad",
          text: "#22221f",
          muted: "#77756e",
          faint: "#a19e95",
          accent: "#24231f",
          accentText: "#f5f3ee",
          glow: "rgba(255,255,255,.65)"
        },

        ocean: {
          bg: "#071117",
          surface: "#0b1a22",
          surfaceHover: "#0f232d",
          line: "#17343f",
          lineHover: "#285866",
          text: "#dcecf0",
          muted: "#789ca7",
          faint: "#4c707b",
          accent: "#b9e9f1",
          accentText: "#071117",
          glow: "rgba(57,171,199,.15)"
        },

        ember: {
          bg: "#120b0a",
          surface: "#1a100e",
          surfaceHover: "#231411",
          line: "#39201b",
          lineHover: "#603229",
          text: "#f0e4df",
          muted: "#a77f73",
          faint: "#70554e",
          accent: "#f1b3a0",
          accentText: "#160b09",
          glow: "rgba(220,83,53,.15)"
        }

      };


      const selected =
        themes[theme] ||
        themes.midnight;


      Object.entries(
        selected
      ).forEach(
        ([key, value]) => {

          document.documentElement
            .style
            .setProperty(
              `--${key.replace(
                /[A-Z]/g,
                m =>
                  "-" +
                  m.toLowerCase()
              )}`,
              value
            );

        }
      );


      localStorage.setItem(
        "gameTheme",
        theme
      );


      themePanel.classList.remove(
        "open"
      );

    }


    /* ============================================================
       LOGIN EVENTS
    ============================================================ */

    loginForm.addEventListener(
      "submit",
      event => {

        event.preventDefault();


        if (
          passwordInput.value ===
          PASSWORD
        ) {

          error.classList.remove(
            "visible"
          );

          showHub();

        } else {

          error.classList.add(
            "visible"
          );

          passwordInput.value =
            "";

          passwordInput.focus();

        }

      }
    );


    logout.addEventListener(
      "click",
      showLogin
    );


    /* ============================================================
       SEARCH
    ============================================================ */

    search.addEventListener(
      "input",
      renderGames
    );


    /* ============================================================
       FILTERS
    ============================================================ */

    document
      .querySelectorAll(".tab")
      .forEach(tab => {

        tab.addEventListener(
          "click",
          () => {

            currentFilter =
              tab.dataset.filter;


            document
              .querySelectorAll(
                ".tab"
              )
              .forEach(item => {

                item.classList.toggle(
                  "active",
                  item === tab
                );

              });


            renderGames();

          }
        );

      });


    /* ============================================================
       RANDOM
    ============================================================ */

    randomButton.addEventListener(
      "click",
      randomGame
    );


    /* ============================================================
       IDEAS
    ============================================================ */

    ideaButton.addEventListener(
      "click",
      () => {

        window.open(
          IDEA_FORM,
          "_blank",
          "noopener,noreferrer"
        );

      }
    );


    /* ============================================================
       GAME MODAL EVENTS
    ============================================================ */

    modalClose.addEventListener(
      "click",
      closeGameModal
    );


    gameModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          gameModal
        ) {

          closeGameModal();

        }

      }
    );


    playButton.addEventListener(
      "click",
      () => {

        if (!selectedGame) {
          return;
        }

        addRecent(
          selectedGame
        );

        window.location.href =
          selectedGame.href;

      }
    );


    modalFavorite.addEventListener(
      "click",
      () => {

        if (!selectedGame) {
          return;
        }

        toggleFavorite(
          selectedGame
        );

      }
    );


    /* ============================================================
       SHORTCUTS
    ============================================================ */

    shortcutButton.addEventListener(
      "click",
      () => {

        shortcuts.classList.add(
          "open"
        );

      }
    );


    shortcuts.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          shortcuts
        ) {

          shortcuts.classList.remove(
            "open"
          );

        }

      }
    );


    /* ============================================================
       THEME PANEL
    ============================================================ */

    themeToggle.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        themePanel.classList.toggle(
          "open"
        );

      }
    );


    themePanel.addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            "[data-theme]"
          );


        if (button) {

          setTheme(
            button.dataset.theme
          );

        }

      }
    );


    document.addEventListener(
      "click",
      event => {

        if (
          !themePanel.contains(
            event.target
          ) &&
          event.target !==
            themeToggle
        ) {

          themePanel.classList.remove(
            "open"
          );

        }

      }
    );


    /* ============================================================
       KEYBOARD SHORTCUTS
    ============================================================ */

    document.addEventListener(
      "keydown",
      event => {

        /* ESC */

        if (
          event.key === "Escape"
        ) {

          if (
            gameModal.classList.contains(
              "open"
            )
          ) {

            closeGameModal();

            return;

          }


          if (
            shortcuts.classList.contains(
              "open"
            )
          ) {

            shortcuts.classList.remove(
              "open"
            );

            return;

          }


          if (
            document.activeElement ===
            search
          ) {

            search.value = "";

            renderGames();

            search.blur();

            return;

          }

        }


        /* SEARCH */

        if (
          event.key === "/" &&
          document.activeElement !==
            passwordInput
        ) {

          event.preventDefault();

          search.focus();

        }


        /* RANDOM */

        if (
          event.key.toLowerCase() ===
            "r" &&
          document.activeElement !==
            search &&
          document.activeElement !==
            passwordInput &&
          !gameModal.classList.contains(
            "open"
          )
        ) {

          randomGame();

        }


        /* LOCK */

        if (
          event.key.toLowerCase() ===
            "l" &&
          document.activeElement !==
            search &&
          document.activeElement !==
            passwordInput &&
          !gameModal.classList.contains(
            "open"
          )
        ) {

          showLogin();

        }


        /* SHORTCUTS */

        if (
          event.key === "?" &&
          document.activeElement !==
            search &&
          document.activeElement !==
            passwordInput
        ) {

          shortcuts.classList.add(
            "open"
          );

        }

      }
    );


    /* ============================================================
       STARTUP
    ============================================================ */

    setTheme(
      localStorage.getItem(
        "gameTheme"
      ) || "midnight"
    );


    if (
      sessionStorage.getItem(
        "gameHubUnlocked"
      ) === "true"
    ) {

      showHub();

    }

  </script>

</body>
</html>
