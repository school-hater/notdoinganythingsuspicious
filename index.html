<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a0c">
  <title>Games</title>

  <style>
    :root {
      --bg: #090a0c;
      --surface: #111318;
      --surface-hover: #171a20;
      --line: #292d35;
      --line-hover: #454a54;
      --text: #eceef1;
      --muted: #9297a0;
      --faint: #626771;
      --accent: #f0f1f3;
      --accent-text: #0b0c0e;
      --glow: rgba(255,255,255,.08);
      --shadow: rgba(0,0,0,.32);
      --modal-bg: rgba(5,6,8,.78);
      --card-radius: 11px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      transition: background .35s ease;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(
          ellipse at 50% -12%,
          var(--glow),
          transparent 44%
        ),
        var(--bg);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background .35s ease, color .35s ease;
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* ============================================================
       LOGIN
    ============================================================ */

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .login {
      width: min(340px, 100%);
      text-align: center;
      animation: fadeUp .65s cubic-bezier(.22,1,.36,1) both;
    }

    .login-mark {
      width: 34px;
      height: 34px;
      margin: 0 auto 26px;
      border: 1px solid var(--line-hover);
      border-radius: 50%;
      position: relative;
      transition: transform .4s cubic-bezier(.22,1,.36,1);
    }

    .login-mark:hover {
      transform: rotate(90deg) scale(1.08);
    }

    .login-mark::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      background: var(--accent);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 18px var(--accent);
    }

    .login h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 450;
      letter-spacing: -.45px;
    }

    .login p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .login-form {
      position: relative;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 78px 0 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      text-align: center;
      transition: .25s ease;
    }

    input::placeholder {
      color: var(--faint);
    }

    input:focus {
      border-color: var(--line-hover);
      background: var(--surface-hover);
      box-shadow: 0 0 0 4px var(--glow);
    }

    .enter {
      position: absolute;
      right: 5px;
      top: 5px;
      height: 36px;
      padding: 0 13px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s ease;
    }

    .enter:hover {
      opacity: .82;
    }

    .error {
      height: 18px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      opacity: 0;
      transition: opacity .25s ease;
    }

    .error.visible {
      opacity: 1;
    }

    /* ============================================================
       HUB
    ============================================================ */

    .hub {
      width: min(980px, 100%);
      margin: auto;
      padding: 34px 20px 55px;
      animation: fadeUp .65s cubic-bezier(.22,1,.36,1) both;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .heading h1 {
      margin: 0 0 5px;
      font-size: 21px;
      font-weight: 450;
      letter-spacing: -.45px;
    }

    .heading p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .action {
      border: 0;
      padding: 5px 0;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      cursor: pointer;
      transition: .2s ease;
    }

    .action:hover {
      color: var(--text);
      transform: translateY(-1px);
    }

    /* ============================================================
       SEARCH
    ============================================================ */

    .search-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .search {
      height: 42px;
      padding: 0 70px 0 13px;
      text-align: left;
      border-radius: 8px;
      background: var(--surface);
    }

    .search-hint {
      position: absolute;
      right: 37px;
      top: 50%;
      transform: translateY(-50%);
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--faint);
      background: var(--bg);
      font-size: 9px;
      pointer-events: none;
    }

    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      width: 13px;
      height: 13px;
      border: 1px solid var(--muted);
      border-radius: 50%;
      transform: translateY(-55%);
      pointer-events: none;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 1px;
      right: -4px;
      bottom: -2px;
      background: var(--muted);
      transform: rotate(45deg);
    }

    /* ============================================================
       FILTERS
    ============================================================ */

    .filter-row {
      min-height: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 1px 10px;
    }

    .tabs {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .tab,
    .random {
      border: 0;
      padding: 3px 0;
      color: var(--faint);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
      transition: .2s ease;
    }

    .tab.active,
    .tab:hover,
    .random:hover {
      color: var(--text);
    }

    .count {
      color: var(--faint);
      font-size: 10px;
      white-space: nowrap;
    }

    /* ============================================================
       RECENT
    ============================================================ */

    .recent {
      margin-bottom: 14px;
    }

    .recent-title {
      margin-bottom: 7px;
      color: var(--faint);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .recent-list {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .recent-item {
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: var(--surface);
      text-decoration: none;
      font-size: 10px;
      transition: .2s ease;
    }

    .recent-item:hover {
      color: var(--text);
      border-color: var(--line-hover);
    }

    /* ============================================================
       GAME GRID
    ============================================================ */

    .games {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .game {
      min-width: 0;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
      padding: 16px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--card-radius);
      opacity: 0;
      transform: translateY(8px);
      animation: cardIn .5s cubic-bezier(.22,1,.36,1) forwards;
      transition:
        background .28s ease,
        border-color .28s ease,
        transform .28s cubic-bezier(.22,1,.36,1),
        box-shadow .28s ease;
      isolation: isolate;

      --game-color: #888;
      --game-amount: .2;
    }

    .game:hover {
      background: var(--surface-hover);
      border-color: var(--line-hover);
      transform: translateY(-3px);
      box-shadow:
        0 14px 32px var(--shadow),
        0 0 0 1px
        color-mix(
          in srgb,
          var(--game-color) 10%,
          transparent
        );
    }

    /* ============================================================
       CARD PATTERNS
       Old:
       none / glow / grid / lines / dots /
       diagonal / rings / noise

       New:
       waves / scanlines / cross / checker / diamonds / mountains
    ============================================================ */

    .game::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      opacity: calc(var(--game-amount) * 2.5);
      pointer-events: none;
      transition: transform .5s ease, opacity .3s ease;
    }

    .game:hover::before {
      transform: scale(1.08);
    }

    .game[data-pattern="none"]::before {
      background: transparent;
    }

    .game[data-pattern="glow"]::before {
      background:
        radial-gradient(
          circle at 70% 25%,
          var(--game-color),
          transparent 58%
        );
      opacity: calc(var(--game-amount) * 1.8);
    }

    .game[data-pattern="grid"]::before {
      background-image:
        linear-gradient(
          color-mix(in srgb, var(--game-color) 45%, transparent) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          color-mix(in srgb, var(--game-color) 45%, transparent) 1px,
          transparent 1px
        );
      background-size: 22px 22px;
    }

    .game[data-pattern="lines"]::before {
      background:
        repeating-linear-gradient(
          0deg,
          color-mix(in srgb, var(--game-color) 42%, transparent) 0 1px,
          transparent 1px 12px
        );
    }

    .game[data-pattern="scanlines"]::before {
      background:
        repeating-linear-gradient(
          0deg,
          color-mix(in srgb, var(--game-color) 48%, transparent) 0 1px,
          transparent 1px 5px
        );
    }

    .game[data-pattern="dots"]::before {
      background-image:
        radial-gradient(
          color-mix(in srgb, var(--game-color) 65%, transparent) 1px,
          transparent 1.5px
        );
      background-size: 13px 13px;
    }

    .game[data-pattern="diagonal"]::before {
      background:
        repeating-linear-gradient(
          135deg,
          color-mix(in srgb, var(--game-color) 48%, transparent) 0 2px,
          transparent 2px 16px
        );
    }

    .game[data-pattern="rings"]::before {
      background:
        repeating-radial-gradient(
          circle at 70% 25%,
          color-mix(in srgb, var(--game-color) 55%, transparent) 0 2px,
          transparent 2px 15px
        );
    }

    .game[data-pattern="noise"]::before {
      background:
        radial-gradient(
          color-mix(in srgb, var(--game-color) 35%, transparent) 1px,
          transparent 1.5px
        );
      background-size: 5px 5px;
      opacity: calc(var(--game-amount) * 2.2);
    }

    .game[data-pattern="waves"]::before {
      background:
        repeating-radial-gradient(
          ellipse at 0% 100%,
          color-mix(in srgb, var(--game-color) 42%, transparent) 0 2px,
          transparent 2px 18px
        );
      transform: rotate(-8deg) scale(1.4);
    }

    .game[data-pattern="cross"]::before {
      background-image:
        linear-gradient(
          color-mix(in srgb, var(--game-color) 38%, transparent) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          color-mix(in srgb, var(--game-color) 38%, transparent) 1px,
          transparent 1px
        );
      background-size: 32px 32px;
    }

    .game[data-pattern="checker"]::before {
      background:
        conic-gradient(
          color-mix(in srgb, var(--game-color) 34%, transparent) 25%,
          transparent 0 50%,
          color-mix(in srgb, var(--game-color) 34%, transparent) 0 75%,
          transparent 0
        );
      background-size: 26px 26px;
    }

    .game[data-pattern="diamonds"]::before {
      background:
        repeating-linear-gradient(
          45deg,
          color-mix(in srgb, var(--game-color) 35%, transparent) 0 1px,
          transparent 1px 14px
        ),
        repeating-linear-gradient(
          -45deg,
          color-mix(in srgb, var(--game-color) 35%, transparent) 0 1px,
          transparent 1px 14px
        );
    }

    /* Celeste-specific mountain silhouette */
    .game[data-pattern="mountains"]::before {
      opacity: calc(var(--game-amount) * 2);
      background:
        linear-gradient(
          135deg,
          transparent 0 32%,
          color-mix(in srgb, var(--game-color) 42%, transparent) 32% 45%,
          transparent 45% 100%
        ),
        linear-gradient(
          45deg,
          transparent 0 42%,
          color-mix(in srgb, var(--game-color) 28%, transparent) 42% 58%,
          transparent 58% 100%
        );
      transform: scale(1.8) translateY(15%);
    }

    .game[data-pattern="mountains"]::after {
      background:
        linear-gradient(
          to top,
          rgba(0,0,0,.75),
          transparent 72%
        );
    }

    .game::after {
      content: "";
      position: absolute;
      inset: 35% 0 0;
      z-index: -1;
      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(0,0,0,.62)
        );
      pointer-events: none;
    }

    .game-open-hint {
      position: absolute;
      top: 13px;
      left: 15px;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: .08em;
      opacity: 0;
      transform: translateY(-3px);
      transition: .2s ease;
    }

    .game:hover .game-open-hint {
      opacity: 1;
      transform: translateY(0);
    }

    .game-info {
      position: relative;
      z-index: 2;
      padding-right: 30px;
    }

    .game-name {
      display: block;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -.1px;
    }

    .game-meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
    }

    .star {
      position: absolute;
      right: 10px;
      top: 9px;
      z-index: 4;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--faint);
      font-size: 15px;
      cursor: pointer;
      transition: transform .2s ease, color .2s ease;
    }

    .star:hover {
      color: var(--text);
      transform: scale(1.15);
    }

    .star.active {
      color: var(--accent);
      text-shadow: 0 0 12px var(--game-color);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 50px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* ============================================================
       MODAL
    ============================================================ */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--modal-bg);
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: min(470px, 100%);
      position: relative;
      overflow: hidden;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      transform: translateY(15px) scale(.97);
      transition: transform .35s cubic-bezier(.22,1,.36,1);
      isolation: isolate;
    }

    .modal.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-card::before {
      content: "";
      position: absolute;
      inset: -30%;
      z-index: -1;
      background:
        radial-gradient(
          circle at 70% 20%,
          var(--modal-color, #888),
          transparent 38%
        );
      opacity: .18;
      pointer-events: none;
    }

    .modal-close {
      position: absolute;
      right: 13px;
      top: 10px;
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-kicker {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .modal-title {
      margin: 7px 0 4px;
      font-size: 25px;
      font-weight: 500;
      letter-spacing: -.6px;
    }

    .modal-genre {
      color: var(--muted);
      font-size: 11px;
    }

    .modal-divider {
      height: 1px;
      margin: 22px 0;
      background: var(--line);
    }

    .vibe-label {
      margin-bottom: 11px;
      color: var(--faint);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .vibe {
      display: grid;
      grid-template-columns: 72px 1fr 40px;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
    }

    .vibe-name,
    .vibe-value {
      color: var(--muted);
      font-size: 10px;
    }

    .vibe-value {
      text-align: right;
    }

    .vibe-track {
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }

    .vibe-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--modal-color, var(--accent));
      box-shadow: 0 0 12px var(--modal-color, var(--accent));
      transition: width .7s cubic-bezier(.22,1,.36,1);
    }

    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .modal-tag {
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: var(--bg);
      font-size: 9px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 22px;
    }

    .play-button {
      flex: 1;
      height: 40px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s ease;
    }

    .play-button:hover {
      opacity: .82;
      transform: translateY(-1px);
    }

    .modal-favorite {
      width: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-hover);
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
    }

    .modal-favorite.active {
      color: var(--accent);
    }

    /* ============================================================
       THEMES
    ============================================================ */

    .theme-panel {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 500;
      display: flex;
      gap: 5px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(10px);
      transform: translateX(-50%);
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .theme-button {
      padding: 6px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 8px;
      cursor: pointer;
      transition: .2s ease;
    }

    .theme-button:hover,
    .theme-button.active {
      background: var(--surface-hover);
      color: var(--text);
    }

    /* ============================================================
       SHORTCUTS
    ============================================================ */

    .shortcuts {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--modal-bg);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .shortcuts.open {
      opacity: 1;
      pointer-events: auto;
    }

    .shortcut-card {
      width: min(360px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 25px 70px rgba(0,0,0,.4);
    }

    .shortcut-card h2 {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 500;
    }

    .shortcut {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }

    .shortcut:last-child {
      border-bottom: 0;
    }

    kbd {
      padding: 3px 6px;
      border: 1px solid var(--line-hover);
      border-radius: 4px;
      color: var(--text);
      background: var(--bg);
      font-size: 9px;
    }

    /* ============================================================
       ANIMATIONS
    ============================================================ */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================================
       MOBILE
    ============================================================ */

    @media (max-width: 760px) {
      .games {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        justify-content: flex-start;
      }
    }

    @media (max-width: 460px) {
      .hub {
        padding: 24px 12px 80px;
      }

      .games {
        grid-template-columns: 1fr;
      }

      .game {
        min-height: 118px;
      }

      .theme-panel {

    /* ============================================================

    const PASSWORD = "5008";

    const IDEA_FORM =

    /* ============================================================

    const loginScreen =

      document.getElementById("hubScreen");

      document.getElementById("loginForm");

      document.getElementById("games");

    const gameCount =
      document.getElementById("gameCount");

    const recentSection =

    const recentList =

    const shortcuts =

    const shortcutButton =
      document.getElementById("shortcutButton");

    const themeToggle =
      document.getElementById("themeToggle");

    const themePanel =
      document.getElementById("themePanel");

    const randomButton =
      document.getElementById("randomButton");

    const ideaButton =
      document.getElementById("ideaButton");

    const gameModal =
      document.getElementById("gameModal");

    const modalTitle =
      document.getElementById("modalTitle");

    const modalGenre =
      document.getElementById("modalGenre");

    const vibes =
      document.getElementById("vibes");

    const modalTags =
      document.getElementById("modalTags");

    const modalClose =
      document.getElementById("modalClose");

    const playButton =
      document.getElementById("playButton");

    const modalFavorite =
      document.getElementById("modalFavorite");


    /* ============================================================

    let currentFilter = "all";
    let selectedGame = null;

    const favorites = new Set(
      JSON.parse(
        localStorage.getItem("gameFavorites") || "[]"
      )
    );

    let recentGames = JSON.parse(
      localStorage.getItem("recentGames") || "[]"
    );


    /* ============================================================
       THEMES
    ============================================================ */

    const themes = {

      midnight: {
        bg:"#090a0c",
        surface:"#111318",
        surfaceHover:"#171a20",
        line:"#292d35",
        lineHover:"#454a54",
        text:"#eceef1",
        muted:"#9297a0",
        faint:"#626771",
        accent:"#f0f1f3",
        accentText:"#0b0c0e",
        glow:"rgba(255,255,255,.08)"
      },

      amoled: {
        bg:"#000000",
        surface:"#090909",
        surfaceHover:"#101010",
        line:"#191919",

        text:"#f2f2f2",
        muted:"#777777",
        faint:"#454545",
        accent:"#ffffff",
        accentText:"#000000",
        glow:"rgba(255,255,255,.055)"
      },

      paper: {
        bg:"#e9e7e1",

        surfaceHover:"#ffffff",

        text:"#22221f",

      },

        line:"#17343f",

        text:"#dcecf0",
        muted:"#789ca7",
        faint:"#4c707b",
        accent:"#b9e9f1",
        accentText:"#071117",
        glow:"rgba(57,171,199,.15)"
      },

      ember: {
        bg:"#120b0a",
        surface:"#1a100e",
        surfaceHover:"#231411",
        line:"#39201b",
        lineHover:"#603229",
        text:"#f0e4df",
        muted:"#a77f73",
        faint:"#70554e",
        accent:"#f1b3a0",
        accentText:"#160b09",
        glow:"rgba(220,83,53,.15)"
      },

      forest: {
        bg:"#08110c",
        surface:"#0d1912",
        surfaceHover:"#132119",
        line:"#1b3424",
        lineHover:"#31563c",
        text:"#e2efe5",
        muted:"#7e9c86",
        faint:"#506b57",
        accent:"#b7d9be",
        accentText:"#08110c",
        glow:"rgba(67,145,83,.15)"
      },

      highcontrast: {
        bg:"#000000",
        surface:"#050505",
        surfaceHover:"#111111",
        line:"#ffffff",
        lineHover:"#ffffff",
        text:"#ffffff",
        muted:"#eeeeee",
        faint:"#cccccc",
        accent:"#ffff00",
        accentText:"#000000",
        glow:"rgba(255,255,0,.15)"
      }

    };


    function setTheme(name) {

      const theme =
        themes[name] || themes.midnight;

      const root =
        document.documentElement;

      root.style.setProperty("--bg", theme.bg);
      root.style.setProperty("--surface", theme.surface);
      root.style.setProperty("--surface-hover", theme.surfaceHover);
      root.style.setProperty("--line", theme.line);
      root.style.setProperty("--line-hover", theme.lineHover);
      root.style.setProperty("--text", theme.text);
      root.style.setProperty("--muted", theme.muted);
      root.style.setProperty("--faint", theme.faint);
      root.style.setProperty("--accent", theme.accent);
      root.style.setProperty("--accent-text", theme.accentText);
      root.style.setProperty("--glow", theme.glow);

      localStorage.setItem(
        "gameTheme",
        name
      );

      document
        .querySelectorAll(".theme-button")
        .forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset.theme === name
          );
        });

    }


    /* ============================================================
       LOGIN
    ============================================================ */

    function showHub() {
      loginScreen.classList.add("hidden");
      hubScreen.classList.remove("hidden");
      renderGames();
    }

    function showLogin() {
      hubScreen.classList.add("hidden");
      loginScreen.classList.remove("hidden");
      passwordInput.value = "";
      passwordInput.focus();
    }


    loginForm.addEventListener(
      "submit",
      event => {

        event.preventDefault();

        if (passwordInput.value === PASSWORD) {

          sessionStorage.setItem(
            "gameHubUnlocked",
            "1"
          );

          error.classList.remove("visible");
          showHub();

        } else {

          error.classList.add("visible");

        }

      }
    );


    logout.addEventListener(
      "click",
      () => {

        sessionStorage.removeItem(
          "gameHubUnlocked"
        );

        showLogin();

      }
    );


    /* ============================================================
       STORAGE
    ============================================================ */

    function saveFavorites() {

      localStorage.setItem(
        "gameFavorites",
        JSON.stringify([...favorites])
      );

    }


    function saveRecent() {

      localStorage.setItem(
        "recentGames",
        JSON.stringify(recentGames)
      );

    }


    /* ============================================================
       FILTERING
    ============================================================ */

    function getFilteredGames() {

      const query =
        search.value
          .trim()
          .toLowerCase();

      return games.filter(game => {

        const matchesSearch =
          !query ||
          game.name
            .toLowerCase()
            .includes(query) ||
          game.genre
            .toLowerCase()
            .includes(query);

        const matchesFilter =
          currentFilter === "all" ||
          favorites.has(game.name);

        return (
          matchesSearch &&
          matchesFilter
        );

      });

    }


    /* ============================================================
       RENDER GAMES
    ============================================================ */

    function renderGames() {

      const visibleGames =
        getFilteredGames();

      gamesContainer.innerHTML = "";

      if (!visibleGames.length) {

        const empty =
          document.createElement("div");

        empty.className = "empty";

        empty.textContent =
          currentFilter === "favorites"
            ? "No favorites yet."
            : "No games found.";

        gamesContainer.appendChild(empty);

      } else {

        visibleGames.forEach(
          (game, index) => {

            const card =
              document.createElement("div");

            card.className = "game";

            card.dataset.pattern =
              game.pattern || "none";

            card.style.setProperty(
              "--game-color",
              game.color || "#888888"
            );

            card.style.setProperty(
              "--game-amount",
              String(
                Math.max(
                  0,
                  Math.min(
                    1,
                    Number(game.amount) || 0
                  )
                )
              )
            );

            card.style.animationDelay =
              `${Math.min(index * .035, .35)}s`;

            const isFavorite =
              favorites.has(game.name);

            card.innerHTML = `

              <span class="game-open-hint">
                OPEN →
              </span>

              <button
                class="star ${isFavorite ? "active" : ""}"
                type="button"
                aria-label="${
                  isFavorite ? "Remove" : "Add"
                } ${game.name} ${
                  isFavorite ? "from" : "to"
                } favorites"
              >
                ${isFavorite ? "★" : "☆"}
              </button>

              <div class="game-info">

                <span class="game-name">
                  ${game.name}
                </span>

                <span class="game-meta">
                  ${game.genre || ""}
                </span>

              </div>

            `;

            card.addEventListener(
              "click",
              event => {

                if (
                  event.target.closest(".star")
                ) {
                  return;
                }

                openGameModal(game);

              }
            );

            card
              .querySelector(".star")
              .addEventListener(
                "click",
                event => {

                  event.preventDefault();
                  event.stopPropagation();

                  toggleFavorite(game);

                }
              );

            gamesContainer.appendChild(card);

          }
        );

      }

      const shown =
        visibleGames.length;

      gameCount.textContent =
        currentFilter === "favorites"
          ? `${shown} favorite${shown === 1 ? "" : "s"}`
          : search.value.trim()
            ? `${shown} of ${games.length} games`
            : `${games.length} games`;

      renderRecent();

    }


    /* ============================================================
       FAVORITES
    ============================================================ */

    function toggleFavorite(game) {

      if (favorites.has(game.name)) {

        favorites.delete(game.name);

      } else {

        favorites.add(game.name);

      }

      saveFavorites();
      renderGames();

      if (
        selectedGame &&
        selectedGame.name === game.name
      ) {
        updateModalFavorite(game);
      }

    }


    function updateModalFavorite(game) {

      const active =
        favorites.has(game.name);

      modalFavorite.classList.toggle(
        "active",
        active
      );

      modalFavorite.textContent =
        active ? "★" : "☆";

    }


    /* ============================================================
       RECENT
    ============================================================ */

    function addRecent(game) {

      recentGames = [
        game.name,
        ...recentGames.filter(
          name => name !== game.name
        )
      ].slice(0, 5);

      saveRecent();

    }


    function renderRecent() {

      const recent =
        recentGames
          .map(name =>
            games.find(
              game => game.name === name
            )
          )
          .filter(Boolean);

      recentList.innerHTML = "";

      if (!recent.length) {

        recentSection.classList.add("hidden");
        return;

      }

      recentSection.classList.remove("hidden");

      recent.forEach(game => {

        const link =
          document.createElement("a");

        link.className =
          "recent-item";

        link.href =
          game.href;

        link.textContent =
          game.name;

        link.addEventListener(
          "click",
          () => addRecent(game)
        );

        recentList.appendChild(link);

      });

    }


    /* ============================================================
       GAME MODAL
    ============================================================ */

    function openGameModal(game) {

      selectedGame = game;

      modalTitle.textContent =
        game.name;

      modalGenre.textContent =
        game.genre || "";

      gameModal.style.setProperty(
        "--modal-color",
        game.color || "#888"
      );

      /* VIBES */

      const vibeData = [
        {
          name: "Intensity",
          value: game.intensity
        },
        {
          name: "Difficulty",
          value: game.difficulty
        },
        {
          name: "Chaos",
          value: game.chaos
        }
      ];

      vibes.innerHTML = "";

      vibeData.forEach(
        (vibe, index) => {

          const safeValue =
            Math.max(
              0,
              Math.min(
                10,
                Number(vibe.value) || 0
              )
            );

          const row =
            document.createElement("div");

          row.className = "vibe";

          row.innerHTML = `

            <span class="vibe-name">
              ${vibe.name}
            </span>

            <div class="vibe-track">

              <div
                class="vibe-fill"
                style="transition-delay:${index * 100}ms"
              ></div>

            </div>

            <span class="vibe-value">
              ${safeValue}/10
            </span>

          `;

          vibes.appendChild(row);

          requestAnimationFrame(() => {

            requestAnimationFrame(() => {

              row
                .querySelector(".vibe-fill")
                .style.width =
                  `${safeValue * 10}%`;

            });

          });

        }
      );


      /* TAGS */

      modalTags.innerHTML = "";

      const tags = [
        game.mode,
        game.type,
        game.playtime
      ].filter(Boolean);

      tags.forEach(tag => {

        const element =
          document.createElement("span");

        element.className =
          "modal-tag";

        element.textContent =
          tag;

        modalTags.appendChild(element);

      });

      updateModalFavorite(game);

      gameModal.classList.add("open");
      document.body.classList.add("modal-open");

    }


    function closeGameModal() {

      gameModal.classList.remove("open");
      document.body.classList.remove("modal-open");
      selectedGame = null;

    }


    modalClose.addEventListener(
      "click",
      closeGameModal
    );


    gameModal.addEventListener(
      "click",
      event => {

        if (
          event.target === gameModal
        ) {
          closeGameModal();
        }

      }
    );


    modalFavorite.addEventListener(
      "click",
      () => {

        if (selectedGame) {
          toggleFavorite(selectedGame);
        }

      }
    );


    playButton.addEventListener(
      "click",
      () => {

        if (!selectedGame) return;

        addRecent(selectedGame);

        window.location.href =
          selectedGame.href;

      }
    );


    /* ============================================================
       SEARCH
    ============================================================ */

    search.addEventListener(
      "input",
      renderGames
    );


    /* ============================================================
       FILTERS
    ============================================================ */

    document
      .querySelectorAll(".tab")
      .forEach(tab => {

        tab.addEventListener(
          "click",
          () => {

            currentFilter =
              tab.dataset.filter;

            document
              .querySelectorAll(".tab")
              .forEach(button => {
                button.classList.toggle(
                  "active",
                  button === tab
                );
              });

            renderGames();

          }
        );

      });


    /* ============================================================
       RANDOM
    ============================================================ */

    randomButton.addEventListener(
      "click",
      () => {

        const available =
          getFilteredGames();

        if (!available.length) return;

        const game =
          available[
            Math.floor(
              Math.random() * available.length
            )
          ];

        openGameModal(game);

      }
    );


    /* ============================================================
       THEMES
    ============================================================ */

    themeToggle.addEventListener(
      "click",
      () => {

        themePanel.classList.toggle(
          "hidden"
        );

      }
    );


    document
      .querySelectorAll(".theme-button")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            setTheme(
              button.dataset.theme
            );

          }
        );

      });


    /* ============================================================
       SHORTCUTS
    ============================================================ */

    shortcutButton.addEventListener(
      "click",
      () => {

        shortcuts.classList.add("open");

      }
    );


    shortcuts.addEventListener(
      "click",
      event => {

        if (
          event.target === shortcuts
        ) {
          shortcuts.classList.remove("open");
        }

      }
    );


    /* ============================================================
       IDEAS
    ============================================================ */

    ideaButton.addEventListener(
      "click",
      () => {

        window.open(
          IDEA_FORM,
          "_blank"
        );

      }
    );


    /* ============================================================
       KEYBOARD
    ============================================================ */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeGameModal();
          shortcuts.classList.remove("open");
          themePanel.classList.add("hidden");

          if (
            document.activeElement === search
          ) {
            search.value = "";
            renderGames();
          }

        }

        if (
          event.key === "/" &&
          document.activeElement !== passwordInput &&
          document.activeElement !== search
        ) {

          event.preventDefault();
          search.focus();

        }

        if (
          event.key.toLowerCase() === "r" &&
          document.activeElement.tagName !== "INPUT"
        ) {

          randomButton.click();

        }

        if (
          event.key === "?" &&
          document.activeElement.tagName !== "INPUT"
        ) {

          shortcutButton.click();

        }

        if (
          event.key.toLowerCase() === "l" &&
          document.activeElement.tagName !== "INPUT"
        ) {

          logout.click();

        }

      }
    );


    /* ============================================================
       STARTUP
    ============================================================ */

    setTheme(
      localStorage.getItem("gameTheme") ||
      "midnight"
    );

    if (
      sessionStorage.getItem(
        "gameHubUnlocked"
      ) === "1"
    ) {

      showHub();

    } else {

      showLogin();

    }

  </script>

</body>
</html>
